<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: the OS may crop this to a circle, so the letter sits
       well inside the 80% safe zone and the ground bleeds to the edges. -->
  <rect width="512" height="512" fill="#000000"/>
  <text x="256" y="268" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="240" font-weight="800" letter-spacing="-10" text-anchor="middle" dominant-baseline="central">R</text>
</svg>
